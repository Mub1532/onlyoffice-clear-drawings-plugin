name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zip plugin
        run: |
          mkdir clear-drawings
          cp -r config.json index.html pluginCode.js resources clear-drawings/
          zip -r clear-drawings.zip clear-drawings

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" clear-drawings.zip --generate-notes
