name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zip plugin
        run: |
          mkdir clear-drawings
          cp -r config.json index.html pluginCode.js resources clear-drawings/
          zip -r clear-drawings.zip clear-drawings

      - name: attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" clear-drawings.zip --clobber
